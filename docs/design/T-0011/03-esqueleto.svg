<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Esqueleto - Cadastro de produtos (A + carrossel)</title>
  <defs>
    <style>
      .bloco { fill: #FFFFFF; stroke: #8A96A3; stroke-width: 1.5; }
      .campo { fill: #F4F6F8; stroke: #7A8794; }
      .foto { fill: #D5DBE2; }
      .linha { fill: #C5CDD6; }
      .forte { fill: #5B6675; }
      .acento { fill: #0F5F73; }
      .rot { font-size: 12px; fill: #33404F; }
      .comp { font-size: 12px; font-weight: 700; fill: #B4235A; font-family: ui-monospace, 'DejaVu Sans Mono', monospace; }
      .nota { font-size: 12px; fill: #B4235A; }
      .guia { stroke: #B4235A; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
      .medida { font-size: 11px; fill: #2C6BB0; font-family: ui-monospace, 'DejaVu Sans Mono', monospace; }
      .med { stroke: #2C6BB0; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1600" height="1100" fill="#EEF1F4"/>
  <text x="40" y="42" font-size="22" font-weight="700" fill="#1B2430">Esqueleto — estrutura de A + produtos em carrossel</text>
  <text x="40" y="66" font-size="13" fill="#4A5563">Rosa = nome do componente/nota · Azul = medidas (tokens em docs/design/sistema/tokens.css) · Cinza = conteúdo</text>

  <!-- =================== DESKTOP =================== -->
  <text x="40" y="104" font-size="15" font-weight="700" fill="#1B2430">Desktop (≥ 960 px) — conteúdo com largura máxima 1200 px</text>
  <g transform="translate(40,116)">
    <rect width="1100" height="780" fill="#F4F6F8" stroke="#8A96A3"/>
    <!-- cabecalho -->
    <rect width="1100" height="60" class="bloco"/>
    <rect x="32" y="18" width="24" height="24" rx="6" class="acento"/>
    <rect x="68" y="22" width="220" height="16" class="forte"/>
    <rect x="980" y="24" width="88" height="12" class="linha"/>
    <text x="300" y="36" class="comp">cabecalho (header) · h1 "Cadastro de produtos"</text>
    <text x="1068" y="54" class="nota" text-anchor="end">contagem: "4 produtos" / "1 produto"</text>

    <!-- grade -->
    <line x1="32" y1="76" x2="372" y2="76" class="med"/><text x="150" y="72" class="medida">coluna 340 px (fixa)</text>
    <line x1="404" y1="76" x2="1068" y2="76" class="med"/><text x="690" y="72" class="medida">coluna 1fr</text>
    <text x="374" y="72" class="medida">32</text>

    <!-- formulario -->
    <rect x="32" y="92" width="340" height="620" rx="10" class="bloco"/>
    <text x="40" y="732" class="comp">form.cartao-form (sticky top: 24 px)</text>
    <rect x="56" y="116" width="140" height="16" class="forte"/>
    <text x="206" y="129" class="nota">h2 "Novo produto"</text>
    <rect x="56" y="140" width="250" height="10" class="linha"/>

    <rect x="56" y="166" width="292" height="70" fill="#FDECEC" stroke="#B3261E" stroke-dasharray="4 3"/>
    <text x="66" y="186" class="comp">resumo-erros (so com erro)</text>
    <text x="66" y="204" class="rot">"Corrija os campos marcados para cadastrar."</text>
    <text x="66" y="222" class="rot">links para cada campo com erro</text>

    <g transform="translate(56,252)">
      <rect width="40" height="10" class="forte"/><text x="300" y="9" class="comp" text-anchor="end">campo</text>
      <rect y="18" width="292" height="44" rx="6" class="campo"/>
      <rect y="70" width="200" height="10" fill="#B3261E"/>
      <text x="206" y="80" class="nota">msg-erro</text>
    </g>
    <g transform="translate(56,346)">
      <rect width="40" height="10" class="forte"/>
      <rect y="18" width="292" height="44" rx="6" class="campo"/><text x="12" y="45" class="rot">R$</text>
      <rect y="70" width="80" height="10" class="linha"/><text x="90" y="80" class="nota">dica "Ex.: 1234,56"</text>
    </g>
    <g transform="translate(56,440)">
      <rect width="70" height="10" class="forte"/>
      <rect y="18" width="292" height="44" rx="6" class="campo"/>
    </g>
    <g transform="translate(56,520)">
      <rect width="110" height="10" class="forte"/>
      <rect y="18" width="292" height="72" rx="6" fill="#F4F6F8" stroke="#7A8794" stroke-dasharray="5 4"/>
      <text x="146" y="50" class="comp" text-anchor="middle">campo-arquivo</text>
      <text x="146" y="70" class="rot" text-anchor="middle">input file nativo + dica de formatos</text>
    </g>
    <rect x="56" y="630" width="292" height="44" rx="6" class="acento"/>
    <text x="202" y="657" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">botao-primario "Cadastrar"</text>
    <text x="56" y="696" class="nota">largura total da coluna · altura 44</text>

    <!-- carrossel -->
    <rect x="404" y="92" width="664" height="430" rx="10" class="bloco"/>
    <text x="412" y="542" class="comp">section.produtos &gt; div.carrossel (role=region, tabindex=0)</text>
    <rect x="428" y="116" width="100" height="16" class="forte"/><text x="538" y="129" class="nota">h2 "Produtos"</text>
    <rect x="428" y="140" width="160" height="10" class="linha"/><text x="596" y="149" class="nota">"Mais recentes primeiro"</text>
    <!-- botoes -->
    <rect x="964" y="112" width="40" height="40" rx="20" fill="#fff" stroke="#7A8794"/><text x="984" y="137" text-anchor="middle" font-size="16" fill="#1B2430">‹</text>
    <rect x="1012" y="112" width="40" height="40" rx="20" fill="#fff" stroke="#7A8794"/><text x="1032" y="137" text-anchor="middle" font-size="16" fill="#1B2430">›</text>
    <text x="956" y="170" class="nota" text-anchor="end">carrossel-nav: só com JS (hidden sem script)</text>

    <!-- cartoes -->
    <g transform="translate(428,184)">
      <rect width="196" height="300" rx="10" class="bloco"/>
      <rect x="10" y="10" width="176" height="176" rx="6" class="foto"/>
      <rect x="10" y="200" width="160" height="12" class="forte"/><rect x="10" y="218" width="110" height="12" class="forte"/>
      <rect x="10" y="240" width="120" height="10" class="linha"/>
      <rect x="10" y="264" width="90" height="16" class="acento"/>
    </g>
    <g transform="translate(640,184)">
      <rect width="196" height="300" rx="10" class="bloco"/>
      <rect x="10" y="10" width="176" height="176" rx="6" fill="#EEF1F4" stroke="#8A96A3" stroke-dasharray="4 3"/>
      <text x="98" y="102" class="rot" text-anchor="middle">"sem imagem"</text>
      <rect x="10" y="200" width="170" height="12" class="forte"/><rect x="10" y="218" width="140" height="12" class="forte"/>
      <rect x="10" y="240" width="120" height="10" class="linha"/>
      <rect x="10" y="264" width="70" height="16" class="forte"/>
    </g>
    <g transform="translate(852,184)">
      <rect width="196" height="300" rx="10" class="bloco"/>
      <rect x="10" y="10" width="176" height="176" rx="6" class="foto"/>
      <rect x="10" y="200" width="150" height="12" class="forte"/>
      <rect x="10" y="222" width="120" height="10" class="linha"/>
      <rect x="10" y="264" width="100" height="16" class="forte"/>
    </g>
    <g transform="translate(1064,184)">
      <rect width="4" height="300" fill="#C5CDD6"/>
    </g>
    <rect x="404" y="494" width="664" height="6" fill="#E3E7EC"/><rect x="428" y="494" width="300" height="6" fill="#8A96A3"/>
    <text x="736" y="510" class="nota">barra de rolagem nativa (visível)</text>

    <!-- anotacoes cartao -->
    <path d="M524 400 L 524 590" class="guia"/>
    <g transform="translate(404,600)">
      <text class="comp">cartao-produto (li &gt; article)</text>
      <text y="20" class="rot">1. foto 1:1, object-fit: cover, alt="Imagem de {nome}"</text>
      <text y="38" class="rot">2. produto novo entra como 1º cartão, sem destaque</text>
      <text y="56" class="rot">3. h3 nome: até 2 linhas (line-clamp), texto completo no DOM</text>
      <text y="74" class="rot">4. fornecedor: 1 linha com reticências</text>
      <text y="92" class="rot">5. valor: maior peso, tabular-nums, nunca quebra</text>
      <text x="420" class="comp">medidas</text>
      <text x="420" y="20" class="medida">cartão 196–240 px:</text>
      <text x="420" y="38" class="medida">3 visíveis + borda do 4º</text>
      <text x="420" y="56" class="medida">gap 16 · padding 10 · raio 10</text>
      <text x="420" y="74" class="medida">scroll-snap x mandatory</text>
      <text x="420" y="92" class="medida">sem rotação automática</text>
    </g>
  </g>

  <!-- =================== CELULAR =================== -->
  <text x="1200" y="104" font-size="15" font-weight="700" fill="#1B2430">Celular (&lt; 720 px) — 360 px</text>
  <g transform="translate(1200,116)">
    <rect width="360" height="900" fill="#F4F6F8" stroke="#8A96A3"/>
    <rect width="360" height="56" class="bloco"/>
    <rect x="16" y="18" width="20" height="20" rx="5" class="acento"/><rect x="46" y="21" width="170" height="14" class="forte"/>
    <rect x="276" y="23" width="68" height="10" class="linha"/>
    <line x1="0" y1="66" x2="16" y2="66" class="med"/><text x="2" y="80" class="medida">16</text>

    <rect x="16" y="72" width="328" height="420" rx="10" class="bloco"/>
    <text x="24" y="510" class="comp">form (sem sticky)</text>
    <rect x="32" y="92" width="120" height="14" class="forte"/>
    <g transform="translate(32,122)"><rect width="40" height="10" class="forte"/><rect y="16" width="296" height="48" rx="6" class="campo"/></g>
    <g transform="translate(32,200)"><rect width="40" height="10" class="forte"/><rect y="16" width="296" height="48" rx="6" class="campo"/><text x="12" y="45" class="rot">R$</text></g>
    <g transform="translate(32,278)"><rect width="70" height="10" class="forte"/><rect y="16" width="296" height="48" rx="6" class="campo"/></g>
    <g transform="translate(32,356)"><rect width="110" height="10" class="forte"/><rect y="16" width="296" height="48" rx="6" fill="#F4F6F8" stroke="#7A8794" stroke-dasharray="5 4"/></g>
    <rect x="32" y="430" width="296" height="48" rx="6" class="acento"/>
    <text x="180" y="459" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Cadastrar (altura 48)</text>

    <rect x="24" y="530" width="100" height="14" class="forte"/>
    <text x="134" y="542" class="nota">sem botões ‹ › : arrasta com o dedo</text>
    <g transform="translate(16,556)">
      <rect width="250" height="330" rx="10" class="bloco"/>
      <rect x="10" y="10" width="230" height="230" rx="6" class="foto"/>
      <rect x="10" y="252" width="200" height="12" class="forte"/>
      <rect x="10" y="276" width="140" height="10" class="linha"/>
      <rect x="10" y="300" width="90" height="16" class="acento"/>
    </g>
    <g transform="translate(282,556)">
      <rect width="78" height="330" class="bloco"/>
      <rect x="10" y="10" width="68" height="230" class="foto"/>
    </g>
  </g>
  <g transform="translate(1200,1030)">
    <text class="nota">Cartão = 78% da largura (borda do próximo à vista).</text>
    <text y="18" class="nota">Campos e botão com 48 px (alvo de toque);</text>
    <text y="36" class="nota">fonte 16 px nos campos (evita zoom no iOS).</text>
  </g>

  <!-- intermediario -->
  <g transform="translate(40,930)">
    <text font-size="15" font-weight="700" fill="#1B2430">Entre 720 e 959 px (tablet)</text>
    <text y="22" class="rot">Mesma pilha do celular (formulário em cima, carrossel embaixo), conteúdo com largura máxima 640 px centrada; cartão com 45% da largura (2 visíveis + borda).</text>
    <text y="44" class="rot">Ordem do DOM = ordem visual em todas as larguras: cabeçalho → formulário → produtos (o Tab segue a leitura).</text>
    <text y="66" class="rot">Estados (vazio, erros, sucesso) no protótipo 04-prototipo.html.</text>
  </g>
</svg>
