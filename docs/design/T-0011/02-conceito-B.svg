<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Conceito B - Vitrine</title>
  <rect width="1600" height="1000" fill="#EFE6D8"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#2B1D14">Conceito B — Vitrine</text>
  <text x="40" y="70" font-size="14" fill="#5E4C3D">A imagem manda: produtos em cartões grandes, formulário como painel "Novo produto" no topo com a foto em destaque. Creme + terracota.</text>

  <!-- ===== DESKTOP ===== -->
  <g transform="translate(40,96)">
    <rect width="1140" height="864" rx="10" fill="#FBF6EF" stroke="#D9CBB6"/>
    <text x="40" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#2B1D14">Cadastro de produtos</text>
    <text x="40" y="88" font-size="14" fill="#6B5847">Cadastre um produto e veja como ele aparece na vitrine.</text>

    <!-- painel novo produto -->
    <rect x="40" y="112" width="1060" height="232" rx="16" fill="#FFFFFF" stroke="#E5D8C4"/>
    <!-- area da foto -->
    <rect x="64" y="136" width="184" height="184" rx="12" fill="#F7EEE2" stroke="#B5462B" stroke-width="2" stroke-dasharray="7 5"/>
    <g transform="translate(156,200)" fill="none" stroke="#B5462B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-22" y="-14" width="44" height="32" rx="5"/><circle cx="0" cy="2" r="9"/><path d="M-8 -14l4-7h8l4 7"/>
    </g>
    <text x="156" y="252" font-size="14" font-weight="700" fill="#9A3A22" text-anchor="middle">Adicionar foto</text>
    <text x="156" y="272" font-size="12" fill="#6B5847" text-anchor="middle">opcional</text>
    <text x="156" y="290" font-size="12" fill="#6B5847" text-anchor="middle">JPEG, PNG ou WebP · 2 MB</text>

    <text x="280" y="152" font-size="13" font-weight="700" fill="#2B1D14">Nome do produto</text>
    <rect x="280" y="160" width="796" height="48" rx="10" fill="#FFFDF9" stroke="#8C7763"/>
    <text x="298" y="190" font-size="16" fill="#2B1D14">Geladeira frost free inox 480 L</text>

    <text x="280" y="236" font-size="13" font-weight="700" fill="#2B1D14">Fornecedor</text>
    <rect x="280" y="244" width="380" height="48" rx="10" fill="#FFFDF9" stroke="#8C7763"/>
    <text x="298" y="274" font-size="16" fill="#2B1D14">Eletro Distribuidora Sul</text>

    <text x="684" y="236" font-size="13" font-weight="700" fill="#2B1D14">Valor (R$)</text>
    <rect x="684" y="244" width="200" height="48" rx="10" fill="#FFFDF9" stroke="#A3231B" stroke-width="2.5"/>
    <text x="702" y="274" font-size="16" fill="#2B1D14">4799,999</text>
    <rect x="684" y="300" width="416" height="30" rx="6" fill="#FBE9E7"/>
    <text x="694" y="320" font-size="11.5" font-weight="600" fill="#8A1C15">✕ Valor inválido. Use o formato 1234,56 (até duas casas decimais).</text>

    <rect x="908" y="244" width="168" height="48" rx="24" fill="#B5462B"/>
    <text x="992" y="274" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Cadastrar</text>

    <!-- vitrine -->
    <text x="40" y="392" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2B1D14">Vitrine</text>
    <text x="1100" y="392" font-size="13" fill="#6B5847" text-anchor="end">4 produtos · mais recentes primeiro</text>

    <!-- cartao 1 -->
    <g transform="translate(40,412)">
      <rect width="250" height="380" rx="14" fill="#fff" stroke="#E5D8C4"/>
      <rect x="0" y="0" width="250" height="250" rx="14" fill="#6B4A2E"/><rect y="236" width="250" height="14" fill="#6B4A2E"/>
      <circle cx="90" cy="110" r="22" fill="#3E2A19"/><circle cx="140" cy="140" r="20" fill="#3E2A19"/><circle cx="160" cy="95" r="16" fill="#4E3522"/>
      <rect x="14" y="14" width="56" height="24" rx="12" fill="#FBF6EF"/><text x="42" y="31" font-size="12" font-weight="700" fill="#9A3A22" text-anchor="middle">novo</text>
      <text x="18" y="282" font-size="15" font-weight="700" fill="#2B1D14">Café torrado em grãos 1 kg</text>
      <text x="18" y="304" font-size="13" fill="#6B5847">Torrefação Serra Azul</text>
      <text x="18" y="354" font-size="22" font-weight="800" fill="#9A3A22">R$ 54,90</text>
    </g>
    <!-- cartao 2 sem imagem, nome longo -->
    <g transform="translate(310,412)">
      <rect width="250" height="380" rx="14" fill="#fff" stroke="#E5D8C4"/>
      <rect x="0" y="0" width="250" height="250" rx="14" fill="#F2E8DA"/><rect y="236" width="250" height="14" fill="#F2E8DA"/>
      <g transform="translate(125,112)" fill="none" stroke="#A08A74" stroke-width="2.5"><rect x="-26" y="-20" width="52" height="40" rx="5"/><path d="M-20 14l14-14 10 10 6-6 14 10"/><circle cx="12" cy="-8" r="5"/></g>
      <text x="125" y="160" font-size="13" fill="#6B5847" text-anchor="middle">sem imagem</text>
      <text x="18" y="282" font-size="15" font-weight="700" fill="#2B1D14">Caixa organizadora de</text>
      <text x="18" y="301" font-size="15" font-weight="700" fill="#2B1D14">polipropileno com tampa e…</text>
      <text x="18" y="323" font-size="13" fill="#6B5847">Plásticos Ipiranga Ltda.</text>
      <text x="18" y="360" font-size="22" font-weight="800" fill="#9A3A22">R$ 89,90</text>
    </g>
    <!-- cartao 3 -->
    <g transform="translate(580,412)">
      <rect width="250" height="380" rx="14" fill="#fff" stroke="#E5D8C4"/>
      <rect x="0" y="0" width="250" height="250" rx="14" fill="#D9DEE2"/><rect y="236" width="250" height="14" fill="#D9DEE2"/>
      <rect x="85" y="40" width="80" height="180" rx="8" fill="#A9B3BC"/><line x1="85" y1="100" x2="165" y2="100" stroke="#D9DEE2" stroke-width="3"/><rect x="150" y="60" width="5" height="26" rx="2" fill="#7B8792"/><rect x="150" y="112" width="5" height="40" rx="2" fill="#7B8792"/>
      <text x="18" y="282" font-size="15" font-weight="700" fill="#2B1D14">Geladeira frost free inox 480 L</text>
      <text x="18" y="304" font-size="13" fill="#6B5847">Eletro Distribuidora Sul</text>
      <text x="18" y="354" font-size="22" font-weight="800" fill="#9A3A22">R$ 4.799,00</text>
    </g>
    <!-- cartao 4 valor alto -->
    <g transform="translate(850,412)">
      <rect width="250" height="380" rx="14" fill="#fff" stroke="#E5D8C4"/>
      <rect x="0" y="0" width="250" height="250" rx="14" fill="#2F3B4A"/><rect y="236" width="250" height="14" fill="#2F3B4A"/>
      <rect x="60" y="80" width="130" height="80" rx="6" fill="#7FA7C2"/><rect x="45" y="160" width="160" height="12" rx="3" fill="#8A96A3"/>
      <text x="18" y="282" font-size="15" font-weight="700" fill="#2B1D14">Lote de notebooks</text><text x="18" y="301" font-size="15" font-weight="700" fill="#2B1D14">corporativos</text>
      <text x="18" y="323" font-size="13" fill="#6B5847">Tech Atacado</text>
      <text x="18" y="360" font-size="21" font-weight="800" fill="#9A3A22">R$ 99.999.999,99</text>
    </g>

    <text x="40" y="830" font-size="13" fill="#5E4C3D">• Foto grande e quadrada em todo cartão; produto sem foto ganha um quadro "sem imagem" no mesmo tamanho, a grade não quebra.</text>
    <text x="40" y="852" font-size="13" fill="#5E4C3D">• Erro em faixa rosada sob o campo, com ✕ e texto escuro; o valor tem peso visual de preço de loja.</text>
  </g>

  <!-- ===== CELULAR ===== -->
  <g transform="translate(1220,96)">
    <rect width="340" height="720" rx="28" fill="#2B1D14"/>
    <rect x="10" y="10" width="320" height="700" rx="20" fill="#FBF6EF"/>
    <text x="28" y="54" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#2B1D14">Cadastro de produtos</text>
    <rect x="22" y="70" width="296" height="300" rx="14" fill="#fff" stroke="#E5D8C4"/>
    <rect x="38" y="86" width="264" height="64" rx="10" fill="#F7EEE2" stroke="#B5462B" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="170" y="114" font-size="13" font-weight="700" fill="#9A3A22" text-anchor="middle">Adicionar foto</text>
    <text x="170" y="134" font-size="11" fill="#6B5847" text-anchor="middle">opcional · câmera ou galeria</text>
    <text x="38" y="170" font-size="12" font-weight="700" fill="#2B1D14">Nome do produto</text>
    <rect x="38" y="176" width="264" height="44" rx="10" fill="#FFFDF9" stroke="#8C7763"/>
    <text x="38" y="238" font-size="12" font-weight="700" fill="#2B1D14">Fornecedor</text>
    <rect x="38" y="244" width="264" height="44" rx="10" fill="#FFFDF9" stroke="#8C7763"/>
    <text x="38" y="306" font-size="12" font-weight="700" fill="#2B1D14">Valor (R$)</text>
    <rect x="38" y="312" width="124" height="44" rx="10" fill="#FFFDF9" stroke="#8C7763"/>
    <rect x="172" y="312" width="130" height="44" rx="22" fill="#B5462B"/><text x="237" y="339" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Cadastrar</text>

    <text x="28" y="404" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#2B1D14">Vitrine</text>
    <g transform="translate(22,418)">
      <rect width="142" height="210" rx="12" fill="#fff" stroke="#E5D8C4"/>
      <rect width="142" height="130" rx="12" fill="#6B4A2E"/><rect y="118" width="142" height="12" fill="#6B4A2E"/>
      <text x="10" y="150" font-size="12" font-weight="700" fill="#2B1D14">Café torrado em…</text>
      <text x="10" y="168" font-size="11" fill="#6B5847">Torrefação Serra…</text>
      <text x="10" y="196" font-size="15" font-weight="800" fill="#9A3A22">R$ 54,90</text>
    </g>
    <g transform="translate(176,418)">
      <rect width="142" height="210" rx="12" fill="#fff" stroke="#E5D8C4"/>
      <rect width="142" height="130" rx="12" fill="#F2E8DA"/><rect y="118" width="142" height="12" fill="#F2E8DA"/>
      <text x="71" y="70" font-size="11" fill="#6B5847" text-anchor="middle">sem imagem</text>
      <text x="10" y="150" font-size="12" font-weight="700" fill="#2B1D14">Caixa organizad…</text>
      <text x="10" y="168" font-size="11" fill="#6B5847">Plásticos Ipiran…</text>
      <text x="10" y="196" font-size="15" font-weight="800" fill="#9A3A22">R$ 89,90</text>
    </g>
    <rect x="22" y="640" width="142" height="60" rx="12" fill="#D9DEE2"/><rect x="176" y="640" width="142" height="60" rx="12" fill="#2F3B4A"/>
    <text x="170" y="750" font-size="12" fill="#5E4C3D" text-anchor="middle">Celular (360 px): 2 cartões por linha</text>
  </g>

  <g transform="translate(1220,880)" font-size="11" fill="#3E2E22">
    <rect width="28" height="28" rx="4" fill="#B5462B"/><rect x="36" width="28" height="28" rx="4" fill="#9A3A22"/><rect x="72" width="28" height="28" rx="4" fill="#2B1D14"/><rect x="108" width="28" height="28" rx="4" fill="#FBF6EF" stroke="#D9CBB6"/><rect x="144" width="28" height="28" rx="4" fill="#A3231B"/>
    <text y="46">terracota #B5462B · tinta #2B1D14 · erro #A3231B</text>
    <text y="64">Títulos Georgia (serifa do sistema), texto system-ui</text>
  </g>
</svg>
