    <text x="38" y="278" font-size="12" font-weight="600" fill="#C9D3DB">Fornecedor</text>
    <rect x="38" y="284" width="264" height="44" rx="3" fill="#0F1317" stroke="#5B6875"/>
    <rect x="38" y="340" width="120" height="44" rx="3" fill="#232B33" stroke="#5B6875"/><text x="98" y="367" font-size="12" font-weight="600" fill="#E8EDF1" text-anchor="middle">Imagem…</text>
    <rect x="168" y="340" width="134" height="44" rx="3" fill="#5EE0B0"/><text x="235" y="367" font-size="14" font-weight="800" fill="#0B0E11" text-anchor="middle">Cadastrar</text>

    <text x="28" y="448" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" font-size="11" fill="#9AA7B2" letter-spacing="1.5">REGISTROS · 4</text>
    <line x1="22" y1="458" x2="318" y2="458" stroke="#5EE0B0" stroke-width="2"/>
    <rect x="22" y="459" width="296" height="62" fill="#16302A"/>
    <rect x="30" y="470" width="40" height="40" rx="3" fill="#6B4A2E"/>
    <text x="80" y="486" font-size="13" font-weight="600" fill="#E8EDF1">Café torrado em grãos 1 kg</text>
    <text x="80" y="504" font-size="11.5" fill="#9AA7B2">Torrefação Serra Azul</text>
    <text x="310" y="504" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#E8EDF1" text-anchor="end">54,90</text>
    <line x1="22" y1="521" x2="318" y2="521" stroke="#2A323A"/>
    <rect x="30" y="532" width="40" height="40" rx="3" fill="none" stroke="#5B6875" stroke-dasharray="3 3"/>
    <text x="80" y="548" font-size="13" font-weight="600" fill="#E8EDF1">Caixa organizadora de poli…</text>
    <text x="80" y="566" font-size="11.5" fill="#9AA7B2">Plásticos Ipiranga Ltda.</text>
    <text x="310" y="566" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#E8EDF1" text-anchor="end">89,90</text>
    <line x1="22" y1="583" x2="318" y2="583" stroke="#2A323A"/>
    <rect x="30" y="594" width="40" height="40" rx="3" fill="#A9B3BC"/>
    <text x="80" y="610" font-size="13" font-weight="600" fill="#E8EDF1">Geladeira frost free inox…</text>
    <text x="80" y="628" font-size="11.5" fill="#9AA7B2">Eletro Distribuidora Sul</text>
    <text x="310" y="628" font-family="ui-monospace, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#E8EDF1" text-anchor="end">4.799,00</text>
    <line x1="22" y1="645" x2="318" y2="645" stroke="#2A323A"/>
    <text x="170" y="750" font-size="12" fill="#9AA7B2" text-anchor="middle">Celular (360 px): rótulos acima dos campos</text>
  </g>

  <g transform="translate(1220,880)" font-size="11" fill="#C9D3DB">
    <rect width="28" height="28" rx="4" fill="#5EE0B0"/><rect x="36" width="28" height="28" rx="4" fill="#14181C" stroke="#5B6875"/><rect x="72" width="28" height="28" rx="4" fill="#E8EDF1"/><rect x="108" width="28" height="28" rx="4" fill="#16302A" stroke="#5B6875"/><rect x="144" width="28" height="28" rx="4" fill="#FF8A80"/>
    <text y="46">menta #5EE0B0 · grafite #14181C · erro #FF8A80</text>
