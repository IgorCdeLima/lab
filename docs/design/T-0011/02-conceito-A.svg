    <text x="92" y="574" font-size="13" font-weight="600" fill="#1B2430">Caixa organizadora de polipr…</text>
    <text x="92" y="594" font-size="12" fill="#4A5563">Plásticos Ipiranga Ltda.</text>
    <text x="306" y="594" font-size="13" font-weight="700" fill="#1B2430" text-anchor="end">R$ 89,90</text>
