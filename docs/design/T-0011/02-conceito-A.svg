    <rect x="500" y="224" width="40" height="18" rx="9" fill="#0F5F73"/><text x="520" y="237" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">novo</text>
    <text x="790" y="222" font-size="14" fill="#33404F">Torrefação Serra Azul</text>
    <text x="1084" y="222" font-size="14" font-weight="600" fill="#1B2430" text-anchor="end">R$ 54,90</text>

    <line x1="405" y1="254" x2="1107" y2="254" stroke="#E3E7EC"/>
    <rect x="428" y="266" width="48" height="48" rx="6" fill="#E3E7EC"/><text x="452" y="288" font-size="9" fill="#4A5563" text-anchor="middle">sem</text><text x="452" y="300" font-size="9" fill="#4A5563" text-anchor="middle">imagem</text>
    <text x="500" y="286" font-size="14" font-weight="600" fill="#1B2430">Caixa organizadora de polipropileno</text>
    <text x="500" y="304" font-size="14" font-weight="600" fill="#1B2430">com tampa e travas laterais, 56 l…</text>
    <text x="790" y="294" font-size="14" fill="#33404F">Plásticos Ipiranga Ltda.</text>
    <text x="1084" y="294" font-size="14" font-weight="600" fill="#1B2430" text-anchor="end">R$ 89,90</text>

    <line x1="405" y1="326" x2="1107" y2="326" stroke="#E3E7EC"/>
    <rect x="428" y="338" width="48" height="48" rx="6" fill="#C9D1D9"/><rect x="440" y="345" width="24" height="34" rx="3" fill="#8A96A3"/><line x1="440" y1="357" x2="464" y2="357" stroke="#C9D1D9" stroke-width="2"/>
    <text x="500" y="366" font-size="14" font-weight="600" fill="#1B2430">Geladeira frost free inox 480 L</text>
    <text x="790" y="366" font-size="14" fill="#33404F">Eletro Distribuidora Sul</text>
    <text x="1084" y="366" font-size="14" font-weight="600" fill="#1B2430" text-anchor="end">R$ 4.799,00</text>

    <line x1="405" y1="398" x2="1107" y2="398" stroke="#E3E7EC"/>
    <rect x="428" y="410" width="48" height="48" rx="6" fill="#2F3B4A"/><rect x="438" y="422" width="28" height="18" rx="2" fill="#7FA7C2"/><rect x="434" y="442" width="36" height="4" rx="1" fill="#8A96A3"/>
    <text x="500" y="438" font-size="14" font-weight="600" fill="#1B2430">Lote de notebooks corporativos</text>
    <text x="790" y="438" font-size="14" fill="#33404F">Tech Atacado</text>
    <text x="1084" y="438" font-size="14" font-weight="600" fill="#1B2430" text-anchor="end">R$ 99.999.999,99</text>
    <line x1="405" y1="470" x2="1107" y2="470" stroke="#E3E7EC"/>

    <g font-size="13">
      <text x="32" y="700" font-weight="700" fill="#0F5F73">Por que assim</text>
      <text x="32" y="724" fill="#33404F">• O formulário fica sempre visível: cadastra, confere a linha nova destacada, cadastra o próximo.</text>
      <text x="32" y="746" fill="#33404F">• Tabela densa com valor alinhado à direita: fácil comparar e achar o que entrou.</text>
      <text x="32" y="768" fill="#33404F">• Erro em vermelho com ícone + texto e borda grossa no campo; foco com anel azul-petróleo.</text>
      <text x="32" y="790" fill="#33404F">• Sucesso: a linha nova vem em destaque com o selo "novo" (o redirect leva a âncora do produto).</text>
      <text x="32" y="812" fill="#33404F">• Celular: as colunas viram uma pilha (formulário, depois lista em linhas compactas).</text>
    </g>
  </g>

  <!-- ===== CELULAR ===== -->
