<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Conceito A - Bancada</title>
  <rect width="1600" height="1000" fill="#E3E7EC"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#1B2430">Conceito A — Bancada</text>
  <text x="40" y="70" font-size="14" fill="#4A5563">Duas colunas: formulário fixo à esquerda, tabela densa à direita. Neutro claro + azul-petróleo. Feito para cadastrar vários itens em sequência.</text>

  <!-- ===== DESKTOP ===== -->
  <g transform="translate(40,96)">
    <rect width="1140" height="864" rx="10" fill="#F4F6F8" stroke="#C5CDD6"/>
    <rect width="1140" height="64" rx="10" fill="#FFFFFF"/>
    <rect y="54" width="1140" height="10" fill="#FFFFFF"/>
    <line x1="0" y1="64" x2="1140" y2="64" stroke="#D5DBE2"/>
    <rect x="32" y="20" width="24" height="24" rx="6" fill="#0F5F73"/>
    <path d="M38 32h12M44 26v12" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="68" y="39" font-size="18" font-weight="700" fill="#1B2430">Cadastro de produtos</text>
    <text x="1108" y="39" font-size="13" fill="#5B6675" text-anchor="end">4 produtos</text>

    <!-- coluna do formulario -->
    <rect x="32" y="96" width="340" height="560" rx="10" fill="#FFFFFF" stroke="#D5DBE2"/>
    <text x="56" y="132" font-size="16" font-weight="700" fill="#1B2430">Novo produto</text>
    <text x="56" y="152" font-size="12" fill="#5B6675">Todos os campos são obrigatórios, exceto a imagem.</text>

    <text x="56" y="186" font-size="13" font-weight="600" fill="#1B2430">Nome</text>
    <rect x="52" y="190" width="300" height="48" rx="9" fill="none" stroke="#0F5F73" stroke-opacity=".35" stroke-width="3"/>
    <rect x="56" y="194" width="292" height="40" rx="6" fill="#fff" stroke="#0F5F73" stroke-width="2"/>
    <text x="68" y="219" font-size="14" fill="#1B2430">Café torrado em grãos 1 kg</text>
    <rect x="252" y="205" width="1.5" height="18" fill="#1B2430"/>

    <text x="56" y="262" font-size="13" font-weight="600" fill="#1B2430">Valor</text>
    <rect x="56" y="270" width="292" height="40" rx="6" fill="#fff" stroke="#8A96A3"/>
    <text x="68" y="295" font-size="14" fill="#5B6675">R$</text>
    <text x="94" y="295" font-size="14" fill="#1B2430">54,90</text>
    <text x="56" y="328" font-size="12" fill="#5B6675">Ex.: 1234,56</text>

    <text x="56" y="358" font-size="13" font-weight="600" fill="#1B2430">Fornecedor</text>
    <rect x="56" y="366" width="292" height="40" rx="6" fill="#fff" stroke="#B3261E" stroke-width="2"/>
    <text x="56" y="426" font-size="12" font-weight="600" fill="#B3261E">⚠ Informe o fornecedor.</text>

    <text x="56" y="458" font-size="13" font-weight="600" fill="#1B2430">Imagem <tspan font-weight="400" fill="#5B6675">(opcional)</tspan></text>
    <rect x="56" y="466" width="292" height="72" rx="6" fill="#F4F6F8" stroke="#8A96A3" stroke-dasharray="5 4"/>
    <text x="202" y="497" font-size="13" font-weight="600" fill="#0F5F73" text-anchor="middle">Escolher arquivo</text>
    <text x="202" y="517" font-size="12" fill="#5B6675" text-anchor="middle">JPEG, PNG ou WebP, até 2 MB</text>

    <rect x="56" y="566" width="292" height="44" rx="6" fill="#0F5F73"/>
    <text x="202" y="594" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Cadastrar</text>
    <text x="202" y="636" font-size="11" fill="#5B6675" text-anchor="middle">Enter também cadastra</text>

    <!-- coluna da lista -->
    <rect x="404" y="96" width="704" height="560" rx="10" fill="#FFFFFF" stroke="#D5DBE2"/>
    <text x="428" y="132" font-size="16" font-weight="700" fill="#1B2430">Produtos</text>
    <text x="1084" y="132" font-size="12" fill="#5B6675" text-anchor="end">mais recentes primeiro</text>
    <rect x="405" y="148" width="702" height="34" fill="#F4F6F8"/>
    <g font-size="12" font-weight="700" fill="#4A5563">
      <text x="428" y="170">IMAGEM</text><text x="500" y="170">NOME</text><text x="790" y="170">FORNECEDOR</text><text x="1084" y="170" text-anchor="end">VALOR</text>
    </g>

    <rect x="405" y="182" width="702" height="72" fill="#E6F2F4"/>
