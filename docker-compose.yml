# Valores padrão (${VAR:-padrão}) servem APENAS para desenvolvimento local.
# Para outros ambientes, defina as variáveis em .env (ver .env.example).
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lab}
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab_dev_local}
    volumes:
      - db_data:/var/lib/postgresql  # imagem 18+: PGDATA fica em /var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lab}
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab_dev_local}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      UPLOADS_DIR: /uploads
    volumes:
      - uploads:/uploads
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # Testes: imagem propria (estagio dev) com pytest; tests/ entra por volume.
  # Uso: docker compose run --rm test
  test:
    profiles: ["test"]
    build:
      context: .
      target: dev
    command: pytest
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lab}
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab_dev_local}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      UPLOADS_DIR: /uploads
    volumes:
      - ./tests:/code/tests:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  uploads:
