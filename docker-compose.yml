# Valores padrão (${VAR:-padrão}) servem APENAS para desenvolvimento local.
# Para outros ambientes, defina as variáveis em .env (ver .env.example).
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lab}
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab_dev_local}
    volumes:
      - db_data:/var/lib/postgresql  # imagem 18+: PGDATA fica em /var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lab}
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab_dev_local}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      UPLOADS_DIR: /uploads
    volumes:
      - uploads:/uploads
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # Testes: imagem propria (estagio dev) com pytest; tests/ entra por volume.
  # Uso: docker compose run --rm test
  test:
    profiles: ["test"]
    build:
      context: .
      target: dev
    command: pytest
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lab}
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab_dev_local}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      UPLOADS_DIR: /uploads
    volumes:
      - ./tests:/code/tests:ro
    depends_on:
      db:
        condition: service_healthy

  # Lint: ruff (config no pyproject.toml). Uso: docker compose run --rm lint
  lint:
    profiles: ["test"]
    build:
      context: .
      target: dev
    command: ruff check .
    working_dir: /code
    volumes:
      - ./app:/code/app:ro
      - ./tests:/code/tests:ro
      - ./pyproject.toml:/code/pyproject.toml:ro

  # Varredura de vulnerabilidades nos arquivos travados e no que foi instalado (precisa de internet).
  # Uso: docker compose run --build --rm audit
  # O 1o comando audita os arquivos travados (exige hash); o 2o, o ambiente instalado na imagem dev.
  audit:
    profiles: ["test"]
    build:
      context: .
      target: dev
    command:
      - sh
      - -c
      - >-
        pip-audit --require-hashes -r requirements.txt -r requirements-dev.txt &&
        pip-audit

  # Gera requirements-lock.txt, requirements.txt e requirements-dev.txt (versao exata + hash)
  # a partir dos .in. Roda no container porque o hash depende da plataforma. Precisa de internet.
  # Uso: docker compose run --build --rm lock
  # Privilegio minimo (SEC-0008): usuario sem root (o do host; ajuste com LOCK_UID/LOCK_GID se
  # o seu nao for 1000), raiz do projeto NAO montada, sistema de arquivos somente leitura.
  # Entram so os 3 .in (somente leitura) e saem so os 3 .txt (arquivos existentes, regravados
  # no lugar, sem trocar o dono). .githooks/, .env, app/ e o resto nao existem no container.
  # Os .txt atuais tambem sao copiados para /tmp: o pip-compile reaproveita os pinos existentes
  # e so muda o que os .in exigem (BUG-T0014-01).
  # Sem --only-binary (SEC-0008, item 3; SEC-T0014-04): a opcao funciona, mas remove os hashes
  # dos sdist e grava a linha "--only-binary :all:" nos 3 travados. E mudanca intencional e mais
  # restritiva, nao adotada aqui; decisao do humano (tarefa propria).
  # Mitigacao: o container nao tem root, nem a raiz do projeto, nem escrita fora dos 3 .txt.
  lock:
    profiles: ["lock"]
    build:
      context: .
      target: lock
    user: "${LOCK_UID:-1000}:${LOCK_GID:-1000}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    working_dir: /tmp
    environment:
      HOME: /tmp
    volumes:
      - ./requirements-lock.in:/in/requirements-lock.in:ro
      - ./requirements.in:/in/requirements.in:ro
      - ./requirements-dev.in:/in/requirements-dev.in:ro
      - ./requirements-lock.txt:/out/requirements-lock.txt
      - ./requirements.txt:/out/requirements.txt
      - ./requirements-dev.txt:/out/requirements-dev.txt
    command:
      - sh
      - -ec
      - >-
        cp /in/*.in /out/*.txt /tmp/ &&
        pip-compile --generate-hashes --allow-unsafe --strip-extras --quiet requirements-lock.in &&
        pip-compile --generate-hashes --allow-unsafe --strip-extras --quiet requirements.in &&
        pip-compile --generate-hashes --allow-unsafe --strip-extras --quiet requirements-dev.in &&
        cat requirements-lock.txt > /out/requirements-lock.txt &&
        cat requirements.txt > /out/requirements.txt &&
        cat requirements-dev.txt > /out/requirements-dev.txt

volumes:
  db_data:
  uploads:
